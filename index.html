<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dialog 工坊 — Minecraft 對話框生成器</title>
<meta name="description" content="可預覽、可存專案、從零開始做 Minecraft 互動式對話框（dialog）的生成器，一鍵匯出資料包。">
<meta property="og:title" content="Dialog 工坊 — Minecraft 對話框生成器">
<meta property="og:description" content="Minecraft 1.21.6+／26.x 對話框（dialog）生成器：即時預覽、流程圖、匯入資料包、一鍵匯出。">
<meta name="theme-color" content="#101216">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='14' height='10' fill='%23262a33' stroke='%236fd08c'/%3E%3Crect x='3' y='5' width='4' height='2' fill='%236fd08c'/%3E%3Crect x='9' y='5' width='4' height='2' fill='%236fd08c'/%3E%3Crect x='3' y='8' width='10' height='2' fill='%239aa1b0'/%3E%3Cpath d='M4 12 L4 15 L7 12' fill='%236fd08c'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;
  --bg:#16181d;--panel:#1e2128;--panel2:#262a33;--line:#343945;--text:#e6e8ee;--dim:#9aa1b0;
  --accent:#6fd08c;--accent2:#58b8ff;--warn:#ffcc55;--err:#ff6b6b;--orange:#ffa04a;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
/* ---------- 頂列 ---------- */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#101216;border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .logo{font-weight:700;font-size:16px;margin-right:6px;white-space:nowrap}
#top .logo b{color:var(--accent)}
#top .pname{color:var(--dim);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;white-space:nowrap}
.tb:hover{border-color:#556}
.tb.pri{background:#2b5a3a;border-color:#3d8a55}
.tb.pri:hover{background:#336b45}
.tb:disabled{opacity:.4;cursor:default}
/* ---------- 三欄 ---------- */
#main{display:grid;grid-template-columns:250px minmax(380px,1fr) minmax(360px,44%);min-height:0}
#side,#mid,#right{min-height:0;overflow:hidden;display:flex;flex-direction:column}
#side{background:var(--panel);border-right:1px solid var(--line)}
#mid{border-right:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:6px;padding:8px 10px;color:var(--dim);font-size:12px;letter-spacing:.05em}
.sec-h .sp{flex:1}
.scroll{overflow:auto;min-height:0}
/* 側欄 */
.proj{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.proj label{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.proj input{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;min-width:0}
#dlist{flex:1;padding:0 6px 8px}
.ditem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.ditem:hover{background:var(--panel2)}
.ditem.on{background:#2a3a30;border-color:#3d6b4b}
.ditem .ic{width:22px;text-align:center;flex:none}
.ditem .tx{min-width:0;flex:1}
.ditem .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .t2{font-size:11px;color:var(--dim);font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .bad{color:var(--err);font-size:12px}
.ditem .star{color:var(--warn);font-size:12px}
.dfold{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--dim);user-select:none}
.dfold:hover{background:var(--panel2);color:var(--text)}
.dfold .ar{width:12px;text-align:center;font-size:11px;flex:none}
.dfold .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Consolas,monospace;font-size:12.5px}
.dfold.cur{color:var(--accent)}
.dfold .bad{color:var(--err);font-size:12px}
.dguide{border-left:1px solid #2f3440;margin-left:13px;padding-left:4px}
.side-foot{border-top:1px solid var(--line);padding:8px;display:flex;gap:6px;flex-wrap:wrap}
/* 中欄分頁 */
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{padding:7px 14px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;color:var(--dim);background:none}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--text);margin-bottom:-1px}
#midBody{flex:1;padding:12px 14px 60px}
/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.card>.ch{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:600;cursor:pointer;user-select:none}
.card>.ch .arrow{color:var(--dim);transition:transform .15s}
.card.closed>.ch .arrow{transform:rotate(-90deg)}
.card.closed>.cb{display:none}
.card>.ch .cnt{color:var(--dim);font-weight:400;font-size:12px}
.card>.cb{padding:4px 12px 12px}
.sub{background:var(--panel2);border:1px solid var(--line);border-radius:7px;margin:8px 0;}
.sub>.sh{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.sub>.sh .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub>.sh .ttl small{color:var(--dim);margin-left:6px}
.sub>.sb{padding:8px 10px}
.sub.fold>.sb{display:none}
.ib{background:none;border:1px solid transparent;border-radius:5px;padding:1px 6px;color:var(--dim);line-height:1.4}
.ib:hover{border-color:var(--line);color:var(--text);background:var(--bg)}
.ib.del:hover{color:var(--err)}
.row{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;margin:6px 0}
.row>.lbl{color:var(--dim);font-size:13px;padding-top:5px}
.row>.ctl{min-width:0;display:flex;flex-direction:column;gap:3px}
.help{font-size:12px;color:var(--dim)}
.help code,.mono{font-family:Consolas,"Cascadia Mono",monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid2 .row{grid-template-columns:auto 1fr}
.grid2 .row>.lbl{min-width:56px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
textarea{resize:vertical}
textarea.code{font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;min-height:70px}
.chk{display:flex;align-items:center;gap:6px;padding-top:4px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add{background:none;border:1px dashed #4a5060;border-radius:6px;padding:5px 10px;color:var(--dim)}
.add:hover{border-color:var(--accent);color:var(--accent)}
.chip{display:inline-block;background:#26334a;border:1px solid #38507a;color:#bcd6ff;border-radius:12px;padding:0 8px;margin:2px 4px 2px 0;font-family:Consolas,monospace;font-size:12px;cursor:pointer}
.chip:hover{background:#30436a}
.badge{display:inline-block;font-size:11px;border-radius:9px;padding:0 7px;background:#333a48;color:var(--dim);font-weight:400}
.badge.g{background:#24452f;color:#9fe5b4}
.badge.o{background:#4a3520;color:#ffc58f}
.badge.b{background:#203a52;color:#9fd2ff}
.warns{border:1px solid #5a4a20;background:#2c2614;border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13px}
.warns div{margin:2px 0}
.warns .e{color:#ff9d9d}
.warns .w{color:#ffd98a}
.empty{color:var(--dim);text-align:center;padding:60px 20px}
/* 文字元件編輯器 */
.ted{display:flex;flex-direction:column;gap:4px}
.seg{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.seg:focus-within{border-color:#4b6a9a}
.seg-top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px;padding:3px}
.seg textarea{border:none;background:none;padding:4px 6px;resize:none;overflow:hidden;min-height:28px;flex:1 1 90px;min-width:0;
  text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.seg textarea:focus{border:none}
.seg-tools{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;flex:0 1 auto;min-width:0;align-items:center;padding-top:2px;margin-left:auto}
.ted,.sub,.sb,.card{min-width:0}
#midBody{overflow-x:hidden}
.tog{width:24px;height:24px;border-radius:4px;border:1px solid transparent;background:none;color:var(--dim);padding:0;font-size:13px}
.tog:hover{border-color:var(--line)}
.tog.on{background:#34445e;color:#fff;border-color:#4d6690}
.sw{width:20px;height:20px;border-radius:4px;border:1px solid #666;padding:0;margin:0 3px}
.sw.def{background:repeating-linear-gradient(45deg,#ddd 0 4px,#999 4px 8px)}
.seg-more{border-top:1px dashed var(--line);padding:6px 8px;display:none}
.seg.more .seg-more{display:block}
.seg-more .row{grid-template-columns:80px 1fr}
.ted-foot{display:flex;gap:8px;align-items:center}
.mini{background:none;border:none;color:var(--dim);font-size:12px;padding:0 2px}
.mini:hover{color:var(--accent)}
/* 色盤 */
#pop{position:fixed;z-index:50;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;width:228px}
#pop .cols{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:8px}
#pop .cols button{height:22px;border-radius:4px;border:1px solid #000}
#pop .cols button:hover{outline:2px solid #fff}
#pop .hexrow{display:flex;gap:6px}
/* 右欄預覽 */
.pv-bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-bar select{width:auto}
.pv-bar .crumb{flex:1;font-size:12px;color:var(--dim);min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pvWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#0c0d10;overflow:hidden}
#pvBox{position:relative;flex:none;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#scr{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;
  font-family:"Minecraft","Monocraft","Unifont","Microsoft JhengHei","PingFang TC",sans-serif;color:#fff;user-select:none}
#pvLog{height:150px;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#pvLog .lg{flex:1;overflow:auto;padding:4px 10px;font-family:Consolas,monospace;font-size:12px}
#pvLog .lg div{padding:1px 0;border-bottom:1px solid #22262e;white-space:pre-wrap;word-break:break-all}
#pvLog .lg .c{color:#9fe5b4}
#pvLog .lg .n{color:var(--dim)}
#pvLog .lg .u{color:#9fd2ff}
/* ---------- 模擬 Minecraft 畫面 ---------- */
.mc-world{position:absolute;inset:0;background:
  linear-gradient(#7ba4f0 0 46%,#a9c6f5 58%,#5f8f3a 58%,#4f7a30 70%,#6b5236 70%,#5a4430 100%);filter:blur(6px);transform:scale(1.1)}
.mc-dim{position:absolute;inset:0;background:rgba(8,8,12,.62)}
.mc-head{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center}
.mc-foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.mc-sep{position:absolute;left:0;right:0;height:2px;background:linear-gradient(#000 0 50%,rgba(255,255,255,.22) 50%)}
.mc-body{position:absolute;left:0;right:0;overflow-y:auto;overflow-x:hidden;background:rgba(0,0,0,.28);scrollbar-width:thin}
.mc-col{display:flex;flex-direction:column;align-items:center}
.mc-t{white-space:pre-wrap;word-break:break-word}
.mc-btn{position:relative;background:#6d6d6d;border-style:solid;border-color:#000;color:#fff;display:flex;align-items:center;justify-content:center;
  overflow:hidden;white-space:nowrap;cursor:pointer;flex:none}
.mc-btn:hover{border-color:#fff}
.mc-btn.off{background:#2e2e2e;color:#a0a0a0;cursor:default}
.mc-btn.off:hover{border-color:#000}
.mc-edit{background:#000;border-style:solid;border-color:#a0a0a0;color:#e0e0e0;outline:none;font:inherit;flex:none}
.mc-edit:focus{border-color:#fff}
.mc-check{display:flex;align-items:center;cursor:pointer}
.mc-box{background:#000;border-style:solid;border-color:#a0a0a0;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.mc-check:hover .mc-box{border-color:#fff}
.mc-slider{position:relative;flex:none;background:#2b2b2b;border-style:solid;border-color:#000}
.mc-slider .knob{position:absolute;top:0;bottom:0;background:#8a8a8a;border-style:solid;border-color:#000;box-sizing:border-box}
.mc-slider:hover .knob{border-color:#fff}
.mc-slider input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.mc-slider .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mc-slot{background:#8b8b8b;border-style:solid;border-color:#373737 #fff #fff #373737;display:flex;align-items:center;justify-content:center;position:relative;flex:none;overflow:hidden}
.mc-slot img{image-rendering:pixelated;width:100%;height:100%}
.mc-slot .ph{color:#333;font-weight:700}
.mc-slot .ct{position:absolute;right:0;bottom:0;color:#fff}
.mc-tip{position:absolute;z-index:9;pointer-events:none;background:rgba(16,0,16,.94);border-style:solid;border-color:#2c0b69;box-shadow:0 0 0 1px #100010;white-space:pre}
.mc-closed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ddd}
.mc-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#ddd}
.mc-tag{position:absolute;right:0;top:0;color:#bbb;opacity:.75}
/* 流程圖 */
#flow svg{display:block}
#flow .node{cursor:pointer}
#flow .node rect{fill:#232733;stroke:#3a4152;stroke-width:1.5}
#flow .node:hover rect{stroke:var(--accent2)}
#flow .node.on rect{stroke:var(--accent);stroke-width:2.5}
#flow .node.start rect{fill:#24352b}
#flow text{fill:var(--text);font-size:13px}
#flow .nid{fill:var(--dim);font-size:11px;font-family:Consolas,monospace}
#flow .el{fill:var(--dim);font-size:11px}
#flow .chipt{font-size:11.5px;cursor:pointer}
#flow .chipt:hover{text-decoration:underline}
/* JSON */
pre.json{background:#0f1115;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-family:Consolas,monospace;font-size:12.5px;max-height:60vh;white-space:pre}
/* 對話視窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column}
.mbox>.mh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.mbox>.mh .sp{flex:1}
.mbox>.mb{padding:14px 16px;overflow:auto}
.mbox>.mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.plist{display:grid;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pitem.on{border-color:#3d8a55}
.pitem .tx{flex:1;min-width:0}
.pitem .tx small{color:var(--dim)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px}
.tpl button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.tpl button:hover{border-color:var(--accent)}
.tpl b{display:block;margin-bottom:3px}
.tpl span{color:var(--dim);font-size:12px}
.typepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.typepick button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.typepick button:hover{border-color:var(--accent)}
.typepick .ic{font-size:20px;width:26px;text-align:center}
.typepick b{display:block}
.typepick span{color:var(--dim);font-size:12px}
.helpdoc h3{margin:16px 0 6px;color:var(--accent)}
.helpdoc p,.helpdoc li{color:#cfd3dc}
.helpdoc code{background:#0f1115;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:Consolas,monospace;font-size:12.5px}
.ftree{font-family:Consolas,monospace;font-size:12.5px;background:#0f1115;border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-height:220px;overflow:auto;white-space:pre}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b5a3a;color:#fff;border-radius:8px;padding:8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
#toast.err{background:#6b2b2b}
@media (max-width:1100px){
  #main{grid-template-columns:220px 1fr;grid-template-rows:1fr 46vh}
  #right{grid-column:1/3;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">Dialog <b>工坊</b> <span class="badge o" id="ver" style="vertical-align:middle"></span></div>
    <div class="pname" id="pname"></div>
    <button class="tb" id="bUndo" title="復原（Ctrl+Z）">↶</button>
    <button class="tb" id="bRedo" title="重做（Ctrl+Y）">↷</button>
    <button class="tb" id="bProj">📁 專案</button>
    <button class="tb" id="bSave" title="下載專案檔（Ctrl+S）">💾 儲存成檔案</button>
    <button class="tb" id="bImport">📥 匯入對話框 JSON</button>
    <button class="tb pri" id="bExport">📦 匯出資料包</button>
    <button class="tb" id="bFeedback" style="display:none">💬 回報問題</button>
    <button class="tb" id="bHelp">？ 說明</button>
    <select class="tb" id="bLang" title="Language" style="width:auto"></select>
  </header>
  <div id="main">
    <aside id="side">
      <div class="proj">
        <label>專案名稱<input type="text" id="pName"></label>
        <label>命名空間<input type="text" id="pNs" class="mono" placeholder="mymap"></label>
      </div>
      <div class="sec-h">對話框 <span class="sp"></span><span id="foldBtns"></span><button class="ib" id="bAddDlg" title="新增對話框">＋ 新增</button></div>
      <div id="dlist" class="scroll"></div>
      <div class="side-foot">
        <button class="ib" id="bDupDlg">⧉ 複製</button>
        <button class="ib" id="bUpDlg">↑</button>
        <button class="ib" id="bDnDlg">↓</button>
        <button class="ib del" id="bDelDlg">✕ 刪除</button>
      </div>
    </aside>
    <section id="mid">
      <div class="tabs">
        <button class="tab on" data-tab="edit">✎ 編輯</button>
        <button class="tab" data-tab="flow">⇄ 流程圖</button>
        <button class="tab" data-tab="json">{ } JSON</button>
        <button class="tab" data-tab="proj">⚙ 專案設定</button>
      </div>
      <div id="midBody" class="scroll"></div>
    </section>
    <section id="right">
      <div class="pv-bar">
        <button class="ib" id="pvBack" title="回到上一個對話框">← 上一個</button>
        <button class="ib" id="pvReset" title="重新打開編輯中的對話框">⟲ 重來</button>
        <button class="ib" id="pvEsc" title="模擬按下 Esc">Esc</button>
        <span class="crumb" id="pvCrumb"></span>
        <select id="pvSize" title="模擬的螢幕大小（GUI 像素）">
          <option value="480x270">1080p・介面 4（480×270）</option>
          <option value="640x360">1080p・介面 3（640×360）</option>
          <option value="427x240">720p・介面 3（427×240）</option>

s are registered when the world loads, so /reload alone won't show new dialogs.\n3. Open one with /dialog show @s {1}:<ID>{2}.\n\nDialogs\n"," 或 /function {0}:open/<ID>":" or /function {0}:open/<ID>","  {0}:{1}　{2}　{3}\n":"  {0}:{1}  {2}  {3}\n","\n「執行指令」按鈕（trigger 計分板 {0}）\n":"\n\"Run commands\" buttons (trigger objective {0})\n","  #{0}　{1}「{2}」→ function {3}:dialog/btn/{4}\n":"  #{0}  {1} \"{2}\" → function {3}:dialog/btn/{4}\n","\n按鈕的指令在 data/{0}/function/dialog/btn/ 裡，可以直接修改；重新從工坊匯出會覆蓋。\n":"\nThe button commands live in data/{0}/function/dialog/btn/ and can be edited there; exporting again from the workshop overwrites them.\n","📦 匯出資料包":"📦 Export datapack","有 {0} 個錯誤，匯出後遊戲可能載入失敗：":"{0} error(s) — the game may fail to load the pack:","：":": ","✔ 檢查通過。":"✔ All checks passed.","安裝方式":"How to install","把 zip 放進存檔的 ":"Put the zip in your world's "," 資料夾。":" folder.","離開世界再重新進入":"Leave the world and join again","（新的對話框只在進入世界時登錄，":" (new dialogs only register when the world loads; "," 不夠）。":" isn't enough).","用 ":"Open it with "," 打開。":".","{0}_dialogs_單檔.json":"{0}_dialogs_all.json","只下載全部 JSON":"Download all JSON only","已下載資料包":"Datapack downloaded","⬇ 下載 .zip":"⬇ Download .zip","未命名":"Untitled","📁 專案":"📁 Projects","新專案":"New project","已建立「":"Created \"","」":"\"","存在這個瀏覽器的專案":"Projects saved in this browser","📂 開啟專案檔…":"📂 Open project file…","編輯中":"editing","{0} 個對話框・{1}":"{0} dialogs · {1}","複製一份":"Make a copy","（副本）":" (copy)","下載專案檔":"Download project file","刪除專案「{0}」？這個動作不能復原（建議先下載專案檔備份）。":"Delete project \"{0}\"? This can't be undone (download a project file first as a backup).","（沒有）":"(none)","專案自動存在這個瀏覽器（清除網站資料就會不見）。要換電腦或備份，請用「💾 儲存成檔案」下載 .dlgproj.json。":"Projects are saved in this browser automatically (clearing site data deletes them). To back up or move to another computer, use \"💾 Save as file\" to download a .dlgproj.json.","之後也可以在「基本設定」換類型，內文和輸入欄位會保留。":"You can change the type later under \"Basics\"; body and inputs are kept.","選一個吧！":"Pick one!","選項一":"Option 1","選項二":"Option 2","這是一則通知。":"This is a notice.","確定要這樣做嗎？":"Are you sure?","返回":"Back","貼上 dialog JSON（單一個，或 {\"ns:id\": {...}, ...} 多個）":"Paste dialog JSON (a single one, or several as {\"ns:id\": {...}, ...})","新對話框的 ID（單一個時）":"ID for the new dialog (single import)","📥 匯入對話框":"📥 Import dialogs","可以把現有資料包 data/<命名空間>/dialog/ 裡的 .json 一次選很多個匯入（檔名就是 ID），或直接貼上 JSON。匯入後會自動把互相開啟的按鈕接起來。":"Pick many .json files from an existing datapack's data/<namespace>/dialog/ at once (the file name becomes the ID), or paste JSON. Buttons that open each other are linked up automatically.","選擇 .json 檔案…":"Choose .json files…","匯入貼上的 JSON":"Import pasted JSON","已匯入 {0} 個對話框":"Imported {0} dialog(s)","？ 說明":"? Help","\n<p>Dialog 工坊是給地圖作者用的 Minecraft <b>對話框（dialog）</b>生成器，支援 1.21.6 以後的版本（含 26.x）。左邊管理對話框、中間編輯、右邊即時預覽，而且預覽裡的按鈕真的可以按：開啟其他對話框、執行的指令會列在下面的紀錄。</p>\n<h3>基本流程</h3>\n<ol>\n<li>「📁 專案」→ 選範本或空白專案。專案會自動存在瀏覽器裡。</li>\n<li>左邊「＋ 新增」加對話框，最常用的是<b>多按鈕選單</b>。</li>\n<li>每顆按鈕選「按下後」要做什麼：開另一個對話框、執行指令、送出輸入值…</li>\n<li>「📦 匯出資料包」下載 zip，放進存檔的 datapacks，<b>離開世界再重新進入</b>。</li>\n</ol>\n<h3>為什麼推薦「執行指令（自動產生資料包）」</h3>\n<p>對話框按鈕直接執行需要權限的指令（give、tp、function…）時，玩家會先看到一個確認畫面，沒有權限的玩家根本執行不了。這個選項改成讓按鈕送出 <code>/trigger 計分板 set 編號</code>（任何玩家都能用），工坊產生的資料包每 tick 偵測，再以那位玩家的身份執行你寫的指令。所以玩家不需要 OP，也不會看到確認畫面。編號固定不變，重新匯出也一樣。</p>\n<h3>輸入欄位</h3>\n<p>文字輸入、勾選框、選項切換、數值滑桿。用「把輸入欄位的值帶進指令」的按鈕，在樣板裡寫 <code>$(鍵名)</code> 代入。要免權限傳進資料包，只能用 <code>/trigger 計分板 set $(鍵名)</code>，而且值要是整數（選項 ID、勾選的真／假值設成數字）。</p>\n<h3>文字樣式</h3>\n<p>每段文字可以設顏色、粗體、斜體、底線、刪除線、亂碼；按「⋯」可以加翻譯鍵（多語系地圖）、滑鼠提示、點擊動作。「＋ 不同樣式的一段」可以在同一行混合不同顏色。</p>\n<h3>小技巧</h3>\n<ul>\n<li>流程圖分頁看整個選單怎麼串接，點節點直接跳過去編輯。</li>\n<li>要用資料包接著開下一個對話框時，「按鈕後」選「等待回應」，畫面不會閃回遊戲。</li>\n<li>JSON 分頁可以複製「內嵌」指令，不放檔案就能在遊戲裡貼上測試。</li>\n<li>Ctrl+Z／Ctrl+Y 復原重做（焦點不在輸入框時），Ctrl+S 下載專案檔。</li>\n<li>預覽的字型、換行位置是近似值，實際以遊戲內為準。</li>\n</ul>":"\n<p>Dialog Workshop is a Minecraft <b>dialog</b> maker for map makers, for 1.21.6 and later (including 26.x). Manage dialogs on the left, edit in the middle and preview on the right — and the preview buttons really work: they open other dialogs, and the commands they'd run show up in the log below.</p>\n<h3>The basics</h3>\n<ol>\n<li>\"📁 Projects\" → pick a template or a blank project. Projects save themselves in your browser.</li>\n<li>Use \"+ Add\" on the left to add dialogs. The one you'll use most is the <b>multi-button menu</b>.</li>\n<li>For each button, choose what happens \"On click\": open another dialog, run commands, send inputs…</li>\n<li>\"📦 Export datapack\" downloads a zip. Put it in your world's datapacks folder, then <b>leave the world and join again</b>.</li>\n</ol>\n<h3>Why \"Run commands (auto datapack)\" is recommended</h3>\n<p>When a dialog button runs a command that needs permission (give, tp, function…), players first get a confirmation screen, and players without permission can't run it at all. This option makes the button send <code>/trigger objective set number</code> instead (any player can do that). The generated datapack checks it every tick and runs your commands as that player — no OP and no confirmation screen. Button numbers never change, even when you export again.</p>\n<h3>Inputs</h3>\n<p>Text input, checkbox, option cycler and number slider. Use a \"Send input values into a command\" button and write <code>$(key)</code> in the template. To get a value into a datapack without permission, the only way is <code>/trigger objective set $(key)</code>, and the value has to be an integer (make option IDs and checkbox values numbers).</p>\n<h3>Text styles</h3>\n<p>Every piece of text can have a colour, bold, italic, underline, strikethrough or obfuscated. Press \"⋯\" to add a translation key (for multi-language maps), hover text or a click action. \"+ Differently styled piece\" mixes colours on one line.</p>\n<h3>Tips</h3>\n<ul>\n<li>The flow map tab shows how your menus link together; click a box to jump to it.</li>\n<li>When a datapack opens the next dialog, set \"After click\" to \"Waiting for response\" so the screen doesn't flash back to the game.</li>\n<li>The JSON tab can copy an inline command you can paste in-game to test without any files.</li>\n<li>Ctrl+Z / Ctrl+Y to undo/redo (when no text box is focused), Ctrl+S to download the project file.</li>\n<li>Fonts and line breaks in the preview are approximate; the game has the final say.</li>\n</ul>","主選單":"Main menu","歡迎！從這裡開始做你的對話框。":"Welcome! Start building your dialogs here.","按鈕一":"Button 1","按鈕二":"Button 2","示範：冒險地圖選單":"Demo: adventure map menus","冒險者選單":"Adventurer's Menu","歡迎來到 ":"Welcome to the ","浮空群島":"Floating Isles","！\n":"!\n","按 G 也能隨時打開這個選單。":"Press G to open this menu any time.","▶ 開始冒險":"▶ Start adventure","傳送到起點":"Teleport to the start","tp @s 0 100 0\ntitle @s title {\"text\":\"冒險開始！\",\"color\":\"gold\"}\nplaysound minecraft:ui.toast.challenge_complete master @s":"tp @s 0 100 0\ntitle @s title {\"text\":\"Adventure begins!\",\"color\":\"gold\"}\nplaysound minecraft:ui.toast.challenge_complete master @s","⚙ 設定":"⚙ Settings","📖 冒險手冊":"📖 Adventurer's guide","💰 商店":"💰 Shop","放棄進度…":"Give up progress…","設定":"Settings","調整之後按「套用難度」。":"Change things, then press \"Apply difficulty\".","難度":"Difficulty","簡單":"Easy","普通":"Normal","困難":"Hard","顯示粒子特效":"Show particles","音量":"Volume","隊伍名稱":"Team name","冒險者":"Adventurer","套用難度":"Apply difficulty","送出 /trigger demo.diff set 1～3":"Sends /trigger demo.diff set 1–3","冒險手冊":"Adventurer's Guide","第一章　":"Chapter 1  ","群島的傳說\n":"Legend of the Isles\n","很久以前，天空中漂浮著七座島嶼…":"Long ago, seven islands drifted in the sky…","指南針會指向下一座島。":"The compass points to the next island.","← 返回":"← Back","商店":"Shop","金蘋果 ×1　—　5 綠寶石":"Golden Apple ×1 — 5 emeralds","鑽石劍　—　20 綠寶石":"Diamond Sword — 20 emeralds","買金蘋果":"Buy golden apple","需要 5 綠寶石":"Costs 5 emeralds","# 數一下身上的綠寶石（clear 數量 0 只計數不清除）\nexecute store result score #n demo.dlg run clear @s minecraft:emerald 0\nexecute if score #n demo.dlg matches 5.. run give @s minecraft:golden_apple\nexecute if score #n demo.dlg matches 5.. run clear @s  .zip":"⬇ 下载 .zip","📁 專案":"📁 项目","新專案":"新项目","已建立「":"已创建“","」":"”","存在這個瀏覽器的專案":"存在这个浏览器的项目","📂 開啟專案檔…":"📂 打开项目文件…","編輯中":"编辑中","{0} 個對話框・{1}":"{0} 个对话框・{1}","複製一份":"拷贝一份","下載專案檔":"下载项目文件","刪除專案「{0}」？這個動作不能復原（建議先下載專案檔備份）。":"删除项目“{0}”？这个动作不能撤销（建议先下载项目文件备份）。","（沒有）":"（没有）","專案自動存在這個瀏覽器（清除網站資料就會不見）。要換電腦或備份，請用「💾 儲存成檔案」下載 .dlgproj.json。":"项目自动存在这个浏览器（清除网站数据就会不见）。要换电脑或备份，请用“💾 保存成文件”下载 .dlgproj.json。","之後也可以在「基本設定」換類型，內文和輸入欄位會保留。":"之后也可以在“基本设置”换类型，内文和输入字段会保留。","選一個吧！":"选一个吧！","選項一":"选项一","選項二":"选项二","這是一則通知。":"这是一则通知。","確定要這樣做嗎？":"确定要这样做吗？","貼上 dialog JSON（單一個，或 {\"ns:id\": {...}, ...} 多個）":"粘贴 dialog JSON（单一个，或 {\"ns:id\": {...}, ...} 多个）","新對話框的 ID（單一個時）":"新对话框的 ID（单一个时）","📥 匯入對話框":"📥 导入对话框","可以把現有資料包 data/<命名空間>/dialog/ 裡的 .json 一次選很多個匯入（檔名就是 ID），或直接貼上 JSON。匯入後會自動把互相開啟的按鈕接起來。":"可以把现有数据包 data/<命名空间>/dialog/ 里的 .json 一次选很多个导入（文件名就是 ID），或直接粘贴 JSON。导入后会自动把互相打开的按钮接起来。","選擇 .json 檔案…":"选择 .json 文件…","匯入貼上的 JSON":"导入粘贴的 JSON","已匯入 {0} 個對話框":"已导入 {0} 个对话框","？ 說明":"？ 说明","\n<p>Dialog 工坊是給地圖作者用的 Minecraft <b>對話框（dialog）</b>生成器，支援 1.21.6 以後的版本（含 26.x）。左邊管理對話框、中間編輯、右邊即時預覽，而且預覽裡的按鈕真的可以按：開啟其他對話框、執行的指令會列在下面的紀錄。</p>\n<h3>基本流程</h3>\n<ol>\n<li>「📁 專案」→ 選範本或空白專案。專案會自動存在瀏覽器裡。</li>\n<li>左邊「＋ 新增」加對話框，最常用的是<b>多按鈕選單</b>。</li>\n<li>每顆按鈕選「按下後」要做什麼：開另一個對話框、執行指令、送出輸入值…</li>\n<li>「📦 匯出資料包」下載 zip，放進存檔的 datapacks，<b>離開世界再重新進入</b>。</li>\n</ol>\n<h3>為什麼推薦「執行指令（自動產生資料包）」</h3>\n<p>對話框按鈕直接執行需要權限的指令（give、tp、function…）時，玩家會先看到一個確認畫面，沒有權限的玩家根本執行不了。這個選項改成讓按鈕送出 <code>/trigger 計分板 set 編號</code>（任何玩家都能用），工坊產生的資料包每 tick 偵測，再以那位玩家的身份執行你寫的指令。所以玩家不需要 OP，也不會看到確認畫面。編號固定不變，重新匯出也一樣。</p>\n<h3>輸入欄位</h3>\n<p>文字輸入、勾選框、選項切換、數值滑桿。用「把輸入欄位的值帶進指令」的按鈕，在樣板裡寫 <code>$(鍵名)</code> 代入。要免權限傳進資料包，只能用 <code>/trigger 計分板 set $(鍵名)</code>，而且值要是整數（選項 ID、勾選的真／假值設成數字）。</p>\n<h3>文字樣式</h3>\n<p>每段文字可以設顏色、粗體、斜體、底線、刪除線、亂碼；按「⋯」可以加翻譯鍵（多語系地圖）、滑鼠提示、點擊動作。「＋ 不同樣式的一段」可以在同一行混合不同顏色。</p>\n<h3>小技巧</h3>\n<ul>\n<li>流程圖分頁看整個選單怎麼串接，點節點直接跳過去編輯。</li>\n<li>要用資料包接著開下一個對話框時，「按鈕後」選「等待回應」，畫面不會閃回遊戲。</li>\n<li>JSON 分頁可以複製「內嵌」指令，不放檔案就能在遊戲裡貼上測試。</li>\n<li>Ctrl+Z／Ctrl+Y 復原重做（焦點不在輸入框時），Ctrl+S 下載專案檔。</li>\n<li>預覽的字型、換行位置是近似值，實際以遊戲內為準。</li>\n</ul>":"\n<p>Dialog 工坊是给地图作者用的 Minecraft <b>对话框（dialog）</b>生成器，支持 1.21.6 以后的版本（含 26.x）。左边管理对话框、中间编辑、右边即时预览，而且预览里的按钮真的可以按：打开其他对话框、运行的指令会列在下面的纪录。</p>\n<h3>基本流程</h3>\n<ol>\n<li>“📁 项目”→ 选范本或空白项目。项目会自动存在浏览器里。</li>\n<li>左边“＋ 添加”加对话框，最常用的是<b>多按钮菜单</b>。</li>\n<li>每颗按钮选“按下后”要做什么：开另一个对话框、运行指令、送出输入值…</li>\n<li>“📦 导出数据包”下载 zip，放进存档的 datapacks，<b>离开世界再重新进入</b>。</li>\n</ol>\n<h3>为什么推荐“运行指令（自动产生数据包）”</h3>\n<p>对话框按钮直接运行需要权限的指令（give、tp、function…）时，玩家会先看到一个确认画面，没有权限的玩家根本运行不了。这个选项改成让按钮送出 <code>/trigger 计分板 set 编号</code>（任何玩家都能用），工坊产生的数据包每 tick 检测，再以那位玩家的身份运行你写的指令。所以玩家不需要 OP，也不会看到确认画面。编号固定不变，重新导出也一样。</p>\n<h3>输入字段</h3>\n<p>文本输入、勾选框、选项切换、数值滑杆。用“把输入字段的值带进指令”的按钮，在样板里写 <code>$(键名)</code> 代入。要免权限传进数据包，只能用 <code>/trigger 计分板 set $(键名)</code>，而且值要是整数（选项 ID、勾选的真／假值设成数字）。</p>\n<h3>文本样式</h3>\n<p>每段文本可以设颜色、粗体、斜体、底线、删除线、乱码；按“⋯”可以加翻译键（多语系地图）、鼠标提示、点击动作。“＋ 不同样式的一段”可以在同一行混合不同颜色。</p>\n<h3>小技巧</h3>\n<ul>\n<li>流程图分页看整个菜单怎么串接，点节点直接跳过去编辑。</li>\n<li>要用数据包接着开下一个对话框时，“按钮后”选“等待回应”，画面不会闪回游戏。</li>\n<li>JSON 分页可以拷贝“内嵌”指令，不放文件就能在游戏里粘贴测试。</li>\n<li>Ctrl+Z／Ctrl+Y 撤销重做（焦点不在输入框时），Ctrl+S 下载项目文件。</li>\n<li>预览的字体、换行位置是近似值，实际以游戏内为准。</li>\n</ul>","主選單":"主菜单","歡迎！從這裡開始做你的對話框。":"欢迎！从这里开始做你的对话框。","按鈕一":"按钮一","按鈕二":"按钮二","示範：冒險地圖選單":"示范：冒险地图菜单","冒險者選單":"冒险者菜单","歡迎來到 ":"欢迎来到 ","浮空群島":"浮空群岛","按 G 也能隨時打開這個選單。":"按 G 也能随时打开这个菜单。","▶ 開始冒險":"▶ 开始冒险","傳送到起點":"发送到起点","tp @s 0 100 0\ntitle @s title {\"text\":\"冒險開始！\",\"color\":\"gold\"}\nplaysound minecraft:ui.toast.challenge_complete master @s":"tp @s 0 100 0\ntitle @s title {\"text\":\"冒险开始！\",\"color\":\"gold\"}\nplaysound minecraft:ui.toast.challenge_complete master @s","⚙ 設定":"⚙ 设置","📖 冒險手冊":"📖 冒险手册","放棄進度…":"放弃进度…","設定":"设置","調整之後按「套用難度」。":"调整之后按“应用难度”。","難度":"难度","簡單":"简单","困難":"困难","顯示粒子特效":"显示粒子特效","隊伍名稱":"队伍名称","冒險者":"冒险者","套用難度":"应用难度","冒險手冊":"冒险手册","群島的傳說\n":"群岛的传说\n","很久以前，天空中漂浮著七座島嶼…":"很久以前，天空中漂浮着七座岛屿…","指南針會指向下一座島。":"指南针会指向下一座岛。","金蘋果 ×1　—　5 綠寶石":"金苹果 ×1　—　5 绿宝石","鑽石劍　—　20 綠寶石":"钻石剑　—　20 绿宝石","買金蘋果":"买金苹果",    流程圖
   ===================================================================== */
function renderFlow() {
  // 心智圖式：只畫樹狀主幹（每個對話框從第一次被開啟的地方長出來），
  // 回頭、開回自己、跳到別的分支都改成方塊裡的小標籤，不拉長線（2026-11-26 使用者：「線無論怎樣都要理好，最好類似心智圖」）
  const box = $('#midBody'); box.innerHTML = '';
  if (!P.dialogs.length) { box.append(h('div', { class: 'empty' }, T('還沒有對話框。'))); return; }
  const links = [];
  for (const d of P.dialogs) {
    for (const b of allButtons(d)) for (const { t, k } of linkTargets(b.act)) links.push({ f: d.uid, t: t.uid, k, l: plain(b.label) });
    if (d.type === 'dialog_list') for (const e of d.list) { const t = getDlg(e.ref) || findById(e.extId); if (t) links.push({ f: d.uid, t: t.uid, k: 'list', l: plain(hasText(t.ext) ? t.ext : t.title) }); }
  }
  // 1) 生成樹：從起始對話框照按鈕順序走
  const parent = {}, kids = {}, seen = new Set(), roots = [];
  for (const r of [P.startUid, ...P.dialogs.map(d => d.uid)].filter(u => u && getDlg(u))) {
    if (seen.has(r)) continue;
    roots.push(r); seen.add(r); const q = [r];
    while (q.length) {
      const u = q.shift(); kids[u] = kids[u] || [];
      for (const l of links) if (l.f === u && !seen.has(l.t)) { seen.add(l.t); parent[l.t] = u; kids[u].push(l.t); q.push(l.t); }
    }
  }
  // 2) 分組：主幹的線（父→子）與小標籤（其他連結）
  const short = s => s.length > 12 ? s.slice(0, 12) + '…' : s;
  const trunk = {}, chips = {};
  const isAncestor = (a, u) => { for (let p = parent[u]; p; p = parent[p]) if (p === a) return true; return false; };
  for (const l of links) {
    if (l.f !== l.t && parent[l.t] === l.f) {
      const key = l.f + '>' + l.t + '>' + l.k;
      const g = trunk[key] = trunk[key] || { f: l.f, t: l.t, k: l.k, labels: [] };
      if (l.l && !g.labels.includes(short(l.l))) g.labels.push(short(l.l));
    } else {
      const arr = chips[l.f] = chips[l.f] || [];
      let c = arr.find(x => x.t === l.t && x.k === l.k);
      if (!c) arr.push(c = { t: l.t, k: l.k, labels: [], icon: l.t === l.f ? '↻' : isAncestor(l.t, l.f) ? '↩' : '→' });
      if (l.l && !c.labels.includes(l.l)) c.labels.push(l.l);
    }
  }
  // 3) 版面：子項目上下排開，父項目對齊子項目的中間
  const W = 210, GX = 170, GY = 18, CH = 17, pos = {}, sub = {};
  const nodeH = u => 48 + (chips[u] ? chips[u].length * CH + 4 : 0);
  const measure = u => {
    const ch = kids[u] || []; let s = 0;
    ch.forEach((c, i) => { s += measure(c) + (i ? GY : 0); });
    return sub[u] = Math.max(nodeH(u), s);
  };
  const place = (u, depth, top) => {
    const ch = kids[u] || [], nh = nodeH(u); let y = top;
    if (ch.length) {
      const total = ch.reduce((s, c, i) => s + sub[c] + (i ? GY : 0), 0);
      let cy = top + Math.max(0, (sub[u] - total) / 2);
      for (const c of ch) { place(c, depth + 1, cy); cy += sub[c] + GY; }
      const a = pos[ch[0]], b = pos[ch[ch.length - 1]];
      y = Math.max(top, (a.y + a.h / 2 + b.y + b.h / 2) / 2 - nh / 2);
    }
    pos[u] = { x: 20 + depth * (W + GX), y, h: nh, d: depth };
  };
  let top = 20;
  for (const r of roots) { measure(r); place(r, 0, top); top += sub[r] + GY * 2; }
  const maxD = Math.max(...Object.values(pos).map(p => p.d));
  const SW = 40 + (maxD + 1) * W + maxD * GX, SH = top;
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (t, a, ...k) => { const e = document.createElementNS(NS, t); for (const x in a) e.setAttribute(x, a[x]); k.forEach(c => e.append(c)); return e; };
  const svg = sv('svg', { width: SW, height: SH, viewBox: `0 0 ${SW} ${SH}` });
  const col = { show: '#58b8ff', cmd: '#ffa04a', list: '#9aa1b0' };
  // 主幹
  const pairN = {};
  for (const e of Object.values(trunk)) {
    const a = pos[e.f], b = pos[e.t];
    const pk = e.f + '>' + e.t, off = (pairN[pk] = (pairN[pk] ?? -1) + 1) * 6;
    const x1 = a.x + W, y1 = a.y + a.h / 2 + off, x2 = b.x, y2 = b.y + 24 + off;
    svg.append(sv('path', { d: `M${x1},${y1} C${x1 + GX / 2},${y1} ${x2 - GX / 2},${y2} ${x2},${y2}`, fill: 'none', stroke: col[e.k], 'stroke-width': 1.8, 'stroke-dasharray': e.k === 'cmd' ? '5 4' : '', opacity: .9 }));
    svg.append(sv('circle', { cx: x2, cy: y2, r: 3, fill: col[e.k] }));
    if (e.labels.length) {
      const lines = e.labels.length > 3 ? [...e.labels.slice(0, 2), T('…還有 {0} 顆', e.labels.length - 2)] : e.labels;
      const t = sv('text', { 'text-anchor': 'end', class: 'el' });
      lines.forEach((l, i) => { const s = sv('tspan', { x: x2 - 8, y: y2 - 6 - (lines.length - 1 - i) * 13 }); s.textContent = l; t.append(s); });
      svg.append(t);
    }
  }
  // 方塊與小標籤
  for (const d of P.dialogs) {
    const p = pos[d.uid]; if (!p) continue;
    const g = sv('g', { class: 'node' + (d.uid === curUid ? ' on' : '') + (d.uid === P.startUid ? ' start' : ''), transform: `translate(${p.x},${p.y})` });
    g.append(sv('rect', { width: W, height: p.h, rx: 8 }));
    const t1 = sv('text', { x: 12, y: 21 }); const tt = (P.startUid === d.uid ? '★ ' : '') + TYPES[d.type].i + ' ' + (plain(d.title) || T('（無標題）')); t1.textContent = tt.length > 17 ? tt.slice(0, 17) + '…' : tt;
    const t2 = sv('text', { x: 12, y: 39, class: 'nid' }); t2.textContent = d.id;
    g.append(t1, t2);
    (chips[d.uid] || []).forEach((c, i) => {
      const tgt = getDlg(c.t);
      let s = c.icon + ' ' + c.labels.join('、');
      if (c.icon !== '↻') s += ' → ' + tgt.id;
      if (s.length > 26) s = s.slice(0, 25) + '…';
      const ct = sv('text', { x: 12, y: 58 + i * CH, class: 'chipt', fill: col[c.k] }); ct.textContent = s;
      const tip = sv('title', {}); tip.textContent = c.labels.join('、') + ' → ' + tgt.id; ct.append(tip);
      ct.addEventListener('click', ev => { ev.stopPropagation(); curUid = c.t; pvReset(); renderAll(); });
      g.append(ct);
    });
    g.addEventListener('click', () => { curUid = d.uid; pvReset(); renderAll(); });
    g.addEventListener('dblclick', () => { curUid = d.uid; tab = 'edit'; pvReset(); renderAll(); });
    svg.append(g);
  }
  box.append(
    h('div', { class: 'help', style: { marginBottom: '8px' } }, h('span', { style: { color: '#58b8ff' } }, T('━ 直接開啟')), T('　'), h('span', { style: { color: '#ffa04a' } }, T('┅ 執行指令後開啟')), T('　'), h('span', { style: { color: '#9aa1b0' } }, T('━ 清單')), T('　點一下選取、按兩下編輯。')),
    h('div', { class: 'help', style: { marginBottom: '8px' } }, T('方塊裡的小標籤：↩ 回到前面　↻ 開回自己　→ 跳到別的分支（點一下跳過去）')),
    h('div', { id: 'flow', style: { overflow: 'auto' } }, svg));
}

const RX_DLG = /(?:^|\/)data\/([a-z0-9_.\-]+)\/dialog\/(.+)\.json$/;

  const dec = new TextDecoder();
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;

    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + xl + cl;
    if (name.endsWith('/') || !wantFile(name)) continue;
    const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    const raw = u8.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw.slice();
    else if (method === 8) data = await inflateRaw(raw);
    else continue;
    if (/\.zip$/i.test(name)) { if (depth < 2) await readZip(data.buffer, prefix + name + '/', out, depth + 1); }

}
// 把找到的檔案分成「資料包根目錄＋命名空間」一組一組
function analyzePack(files) {
  const dec = new TextDecoder(), groups = {}, bad = [];
  const text = f => dec.decode(f.data).replace(/^﻿/, '');
  for (const f of files) {
    const m = RX_DLG.exec(f.path); if (!m) continue;
    const root = f.path.slice(0, m.index + (f.path[m.index] === '/' ? 1 : 0));
    const key = root + '|' + m[1];
    const g = groups[key] = groups[key] || { root, ns: m[1], entries: [] };
    try { g.entries.push([m[2], JSON.parse(text(f)), m[1]]); } catch { bad.push(f.path); }
  }
  for (const g of Object.values(groups)) {
    const meta = files.find(f => f.path === g.root + 'pack.mcmeta');
    if (meta) { try { g.meta = JSON.parse(text(meta)).pack; } catch { } }
    g.tags = {};
    for (const t of ['pause_screen_additions', 'quick_actions']) {
      const f = files.find(x => x.path === g.root + `data/minecraft/tags/dialog/${t}.json`);
      if (f) { try { g.tags[t] = (JSON.parse(text(f)).values || []).map(v => typeof v === 'string' ? v : v.id); } catch { } }
    }
    g.entries.sort((a, b) => a[0].localeCompare(b[0]));

function importPackGroup(g, name, bad) {
  saveNow();
  const p = newProject(name || g.ns); p.ns = g.ns;
  if (g.meta) {
    const lo = g.meta.min_format ?? g.meta.pack_format, hi2 = g.meta.max_format ?? g.meta.pack_format;
    if (lo != null) { p.packMin = Array.isArray(lo) ? lo[0] : lo; p.packMax = Array.isArray(hi2) ? hi2[0] : (hi2 ?? p.packMin); }
    if (typeof g.meta.description === 'string') p.desc = g.meta.description;
  }
  P = p;
  for (const [id, j] of g.entries) P.dialogs.push(importDialog(j, uniqueId(id)));
  relinkRefs();
  const inTag = (t, d) => (g.tags[t] || []).includes(refOf(d));
  for (const d of P.dialogs) { d.tagPause = inTag('pause_screen_additions', d); d.tagQuick = inTag('quick_actions', d); }
  // 起始對話框：放在快速動作／暫停畫面的優先，其次是沒有別人開啟它的
  const incoming = new Set();
  for (const d of P.dialogs) for (const b of allButtons(d)) for (const { t } of linkTargets(b.act)) if (t !== d) incoming.add(t.uid);
  const start = P.dialogs.find(d => d.tagQuick || d.tagPause) || P.dialogs.find(d => !incoming.has(d.uid)) || P.dialogs[0];
  P.startUid = start?.uid || null;
  // 大資料包：資料夾預設全部收合（起始對話框所在的那層會自動展開）
  for (const d of P.dialogs) { const parts = d.id.split('/'); for (let i = 1; i < parts.length; i++) closedFolders.add(foldKey(parts.slice(0, i).join('/'))); }
  saveFolds();
  openProject(P);
  toast(T('已匯入「{0}」：{1} 個對話框', P.name, P.dialogs.length) + (bad.length ? T('，{0} 個檔案讀不了：{1}', bad.length, bad.slice(0, 3).join('、')) : ''), bad.length > 0);
}
async function readPickedFiles(list, zipName) {
  const out = [];
  for (const f of list) {
    const path = f.webkitRelativePath || f.name;
    if (!wantFile(path)) continue;
    const buf = await f.arrayBuffer();
    if (/\.zip$/i.test(path)) await readZip(buf, path === f.name && list.length === 1 ? '' : path + '/', out);
    else out.push({ path, data: new Uint8Array(buf) });
  }
  return out;
}

// 放在 GitHub Pages（使用者.github.io/儲存庫）時，回報按鈕自動指向那個儲存庫的 Issues
function repoUrl() {
  const host = location.hostname; if (!host.endsWith('.github.io')) return null;
  const user = host.split('.')[0], seg = location.pathname.split('/').filter(Boolean)[0];
  return `https://github.com/${user}/${seg && !seg.includes('.') ? seg : host}`;
}
function feedbackUrl(kind = 'bug.yml') {
  const r = repoUrl(); if (!r) return null;
  const q = new URLSearchParams({ template: kind, version: APP_VERSION, lang: LANG, browser: navigator.userAgent.slice(0, 200) });
  return `${r}/issues/new?${q}`;
}
